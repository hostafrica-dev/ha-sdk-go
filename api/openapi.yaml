components:
  schemas:
    BackupCreateResponseData:
      description: Response data for backup creation operation
      example:
        backup_is_creating: true
        task_id: 0
        message: message
        backup_creation:
          updated_at: updated_at
          created_at: created_at
          id: 6
          message: message
          status: status
      properties:
        message:
          description: Status message indicating the result
          type: string
        task_id:
          description: Task ID for the backup creation process
          format: int32
          type: integer
        backup_is_creating:
          description: Whether a backup is currently being created
          type: boolean
        backup_creation:
          $ref: "#/components/schemas/BackupCreationInfo"
      required:
      - backup_creation
      - backup_is_creating
      - message
      - task_id
      type: object
    BackupCreationInfo:
      description: Information about an ongoing backup creation process
      example:
        updated_at: updated_at
        created_at: created_at
        id: 6
        message: message
        status: status
      properties:
        id:
          description: Backup creation task ID
          format: int32
          type: integer
        status:
          description: Status of the backup creation
          type: string
        message:
          description: Status message
          type: string
        created_at:
          description: Timestamp when backup creation started
          type: string
        updated_at:
          description: Timestamp when backup creation was last updated
          type: string
      required:
      - created_at
      - id
      - message
      - status
      - updated_at
      type: object
    BackupItem:
      description: Individual backup item
      example:
        size: size
        protected: true
        format: format
        id: 0
        create_date: create_date
      properties:
        id:
          description: Backup ID
          format: int32
          type: integer
        size:
          description: Backup size in human-readable format
          type: string
        create_date:
          description: Backup creation date and time
          type: string
        format:
          description: "Backup format (e.g., vma, vma.lzo)"
          type: string
        protected:
          description: Whether the backup is protected from deletion
          type: boolean
      required:
      - create_date
      - format
      - id
      - protected
      - size
      type: object
    BackupMode:
      description: Backup mode option
      example:
        label: label
        value: value
      properties:
        value:
          description: Backup mode value
          type: string
        label:
          description: Human-readable label for the backup mode
          type: string
      required:
      - label
      - value
      type: object
    BackupModeType:
      description: Backup mode enum - controls how the VM is handled during backup
      enum:
      - snapshot
      - suspend
      - stop
      type: string
    BackupSchedule:
      description: Individual backup schedule item
      example:
        mode: mode
        compress: "0"
        mailto: mailto
        id: id
        starttime: starttime
        dow: dow
      properties:
        id:
          description: Schedule ID
          type: string
        starttime:
          description: Start time for backup (HH:MM format)
          type: string
        dow:
          description: Days of week (comma-separated)
          type: string
        compress:
          $ref: "#/components/schemas/CompressionType"
        mode:
          description: Backup mode
          type: string
        mailto:
          description: Email address for notifications (null if not set)
          type: string
      required:
      - compress
      - dow
      - id
      - mode
      - starttime
      type: object
    BackupScheduleListResponseData:
      description: Response data for backup schedule list operation
      example:
        schedules:
        - mode: mode
          compress: "0"
          mailto: mailto
          id: id
          starttime: starttime
          dow: dow
        - mode: mode
          compress: "0"
          mailto: mailto
          id: id
          starttime: starttime
          dow: dow
        message: message
      properties:
        message:
          description: Status message indicating the result
          type: string
        schedules:
          description: List of backup schedules
          items:
            $ref: "#/components/schemas/BackupSchedule"
          type: array
      required:
      - message
      - schedules
      type: object
    BadRequestErrorResponseContent:
      example:
        data: "{}"
        message: message
      properties:
        message:
          type: string
        data:
          description: Empty object for operations that don't return data
          type: object
      required:
      - data
      - message
      type: object
    BillingCycle:
      description: Billing cycle enum
      enum:
      - monthly
      - annually
      type: string
    CancelVpsRequestContent:
      example:
        service_id: service_id
        type: immediate
      properties:
        service_id:
          description: Service ID - must be sent as a string
          type: string
        type:
          $ref: "#/components/schemas/VpsCancelType"
      required:
      - service_id
      type: object
    CancelVpsResponseContent:
      example:
        data:
          service_id: 0
          cancellation_type: cancellation_type
          message: message
          status: status
        status: success
      properties:
        status:
          $ref: "#/components/schemas/OperationStatus"
        data:
          $ref: "#/components/schemas/VpsCancelResponseData"
      required:
      - data
      - status
      type: object
    CatalogueConfigOption:
      description: "A configurable option available for a product (e.g. Backup Quota,\
        \ OS Template)"
      example:
        suboptions:
        - name: name
          id: 1
          prices: ""
        - name: name
          id: 1
          prices: ""
        qty_min: 4
        qty_max: 7
        name: name
        id: 2
        type: type
      properties:
        id:
          description: Config option identifier
          format: int32
          type: integer
        name:
          description: Config option display name
          type: string
        type:
          description: "Control type (e.g. selection, quantity)"
          type: string
        qty_min:
          description: Minimum quantity (null for selection types)
          format: int32
          type: integer
        qty_max:
          description: Maximum quantity (null for selection types)
          format: int32
          type: integer
        suboptions:
          description: Available suboptions for this config option
          items:
            $ref: "#/components/schemas/CatalogueConfigSuboption"
          type: array
      required:
      - id
      - name
      - suboptions
      - type
      type: object
    CatalogueConfigSuboption:
      description: A suboption (selectable value) within a config option
      example:
        name: name
        id: 1
        prices: ""
      properties:
        id:
          description: Suboption identifier
          format: int32
          type: integer
        name:
          description: Suboption display name
          type: string
        prices:
