      properties:
        service_id:
          description: Service ID - must be sent as a string
          type: string
        power_task_action:
          $ref: "#/components/schemas/PowerTaskAction"
        start_date:
          description: "Start date in Y-m-d format (e.g., 2026-03-25)"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        description:
          description: Description of the power task
          type: string
        start_time:
          description: Start time in HH:MM or HH:MM:SS format
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
          type: string
        end_date:
          description: "End date in Y-m-d format (e.g., 2026-12-31)"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          type: string
        end_time:
          description: End time in HH:MM or HH:MM:SS format
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
          type: string
        job_type:
          $ref: "#/components/schemas/PowerTaskJobType"
        job_time:
          description: Job execution time in HH:MM or HH:MM:SS format
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
          type: string
        job_hour:
          description: Job hour (alternative to job_time)
          format: int32
          maximum: 23
          minimum: 0
          type: integer
        job_minutes:
          description: Job minutes (alternative to job_time)
          format: int32
          maximum: 59
          minimum: 0
          type: integer
        days:
          description: Days of the week for weekly jobs
          items:
            $ref: "#/components/schemas/DayOfWeek"
          type: array
