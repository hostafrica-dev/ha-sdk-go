openapi: 3.0.2
info:
  description: HostAfrica API
  title: HostAfricaApi
  version: 2026-01-01
servers:
- description: HostAfrica API
  url: https://api.hostafrica.com
security:
- BearerAuth: []
tags:
- description: Create and restore on-demand backups of your VPS instances and configure
    automated backup schedules to protect your data.
  name: Backups
- description: Open an in-browser noVNC console session to your VPS for direct terminal
    access when SSH is unavailable.
  name: Console Access
- description: Manage reverse DNS (rDNS) records that map IP addresses assigned to
    your services back to hostnames.
  name: DNS
- description: "Define and manage inbound and outbound firewall rules for your VPS\
    \ instances, including rule ordering and priority management."
  name: Firewall
- description: "Configure notification triggers on resource metrics such as CPU, memory,\
    \ and disk usage to receive alerts when thresholds are breached."
  name: Monitoring
- description: "Control the power state of your VPS instances and schedule automated\
    \ power tasks. Start, stop, reboot, or gracefully shut down a VPS, and create\
    \ or manage recurring power schedules."
  name: Power Management
- description: "Manage OS-level credentials and SSH key access for your VPS instances,\
    \ including password changes and SSH key rotation."
  name: Security
- description: "Browse the service catalogue, validate pricing, place orders, and\
    \ manage existing subscriptions including cancellation and payment retries."
  name: Service Management
- description: "Capture point-in-time snapshots of a VPS disk, update snapshot metadata,\
    \ roll back to a previous snapshot, and delete snapshots you no longer need."
  name: Snapshots
- description: Manage account-level user settings such as updating the password for
    the authenticated user.
  name: User Management
- description: "Manage your VPS instances — list services, retrieve configuration\
    \ details, update settings, mount ISO images, and reinstall the operating system."
  name: VPS Management
